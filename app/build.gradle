apply plugin: 'com.android.application'

android {
    ndkVersion "27.0.12077973"

    compileSdk 37

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        targetSdk 36

        // Artemis's own version (upstream Moonlight's was 12.2, 315); the code only grows, so updates install over it.
        versionName "1.2"
        versionCode = 318

        applicationId "com.danielzn.artemis.tv"
        buildConfigField "boolean", "ROOT_BUILD", "false"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            ndkBuild {
                arguments "PRODUCT_FLAVOR=nonRoot"
            }
        }

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    // The release key: one stable key (the APKs installed so far were signed with it), kept on the build machine
    // and given by Gradle properties there (~/.gradle/gradle.properties): artemisTvKeystore, artemisTvKeystorePassword,
    // artemisTvKeyAlias, artemisTvKeyPassword. Without them the release APK is left unsigned.
    def releaseKey = ['artemisTvKeystore', 'artemisTvKeystorePassword', 'artemisTvKeyAlias', 'artemisTvKeyPassword']
            .every { project.hasProperty(it) }
    signingConfigs {
        if (releaseKey) {
            release {
                storeFile file(project.property('artemisTvKeystore'))
                storePassword project.property('artemisTvKeystorePassword')
                keyAlias project.property('artemisTvKeyAlias')
                keyPassword project.property('artemisTvKeyPassword')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "Artemis (Debug)"
        }
        release {
            // Its own application id (com.danielzn.artemis.tv), so it never reports as official Moonlight.
            // Signed with the release key above (not debuggable); sideloaded, never published to a store.
            resValue "string", "app_label", "Artemis"
            debuggable false
            signingConfig releaseKey ? signingConfigs.release : null

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    packaging {
        resources {
            // BouncyCastle includes duplicate LICENSE.md files
            excludes += '/META-INF/*.md'
        }
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    testImplementation 'junit:junit:4.13.2'
}
